apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- configmap.yaml
- deployment.yaml
- pvc.yaml
- service.yaml
secretGenerator:
  - name: vllm-secrets
    envs:
      - .env.secrets
generatorOptions:
  disableNameSuffixHash: true
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/part-of: vllm-inference-system
